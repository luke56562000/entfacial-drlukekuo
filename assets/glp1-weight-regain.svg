<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf3f5"/><stop offset="1" stop-color="#d3e6ea"/></linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe8ec"/></linearGradient>
    <linearGradient id="scale" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6eef1"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0b3a44" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1350" cy="160" r="240" fill="#0b5563" opacity="0.06"/>
  <circle cx="200" cy="780" r="180" fill="#0b5563" opacity="0.06"/>
  <g fill="#0b5563" opacity="0.10">
    <circle cx="120" cy="120" r="4"/><circle cx="160" cy="120" r="4"/><circle cx="200" cy="120" r="4"/>
    <circle cx="120" cy="160" r="4"/><circle cx="160" cy="160" r="4"/><circle cx="200" cy="160" r="4"/>
    <circle cx="120" cy="200" r="4"/><circle cx="160" cy="200" r="4"/><circle cx="200" cy="200" r="4"/>
  </g>

  <!-- 體重計 -->
  <g filter="url(#sh)">
    <rect x="880" y="300" width="460" height="400" rx="44" fill="url(#scale)"/>
    <rect x="920" y="340" width="380" height="120" rx="24" fill="#0b5563"/>
    <text x="1110" y="424" font-family="-apple-system,Helvetica Neue,Arial,sans-serif" font-size="72" font-weight="700" fill="#e8f6f8" text-anchor="middle" letter-spacing="2">72.4</text>
    <text x="1272" y="424" font-family="-apple-system,Helvetica Neue,Arial,sans-serif" font-size="30" font-weight="700" fill="#8ad3e0" text-anchor="end">kg</text>
    <rect x="920" y="500" width="380" height="160" rx="24" fill="#f4f8f9" stroke="#d3e0e4" stroke-width="3"/>
    <g fill="#c6d6db"><circle cx="1010" cy="580" r="26"/><circle cx="1110" cy="580" r="26"/><circle cx="1210" cy="580" r="26"/></g>
  </g>

  <!-- 注射筆 -->
  <g transform="translate(150 790) rotate(-22) scale(0.92)" filter="url(#sh)">
    <rect x="0" y="-46" width="720" height="92" rx="46" fill="url(#pen)" stroke="#c9d8dd" stroke-width="3"/>
    <rect x="0" y="-46" width="150" height="92" rx="46" fill="#0b5563"/>
    <rect x="110" y="-46" width="40" height="92" fill="#0b5563"/>
    <rect x="200" y="-24" width="230" height="48" rx="10" fill="#ffffff" stroke="#c9d8dd" stroke-width="3"/>
    <g stroke="#1d7d8f" stroke-width="4" stroke-linecap="round"><line x1="230" y1="-12" x2="230" y2="12"/><line x1="270" y1="-6" x2="270" y2="6"/><line x1="310" y1="-12" x2="310" y2="12"/><line x1="350" y1="-6" x2="350" y2="6"/><line x1="390" y1="-12" x2="390" y2="12"/></g>
    <rect x="560" y="-34" width="120" height="68" rx="16" fill="#1d7d8f"/>
    <rect x="690" y="-16" width="70" height="32" rx="8" fill="#9fb8bf"/>
    <rect x="760" y="-4" width="60" height="8" rx="4" fill="#6b8791"/>
  </g>

  <!-- 體重曲線：下降後回升 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M260 230 C 380 236, 450 300, 520 360 C 560 392, 600 430, 640 430" stroke="#0b5563" stroke-width="16"/>
    <path d="M640 430 C 690 430, 730 390, 790 350" stroke="#e0902e" stroke-width="16" stroke-dasharray="2 30"/>
  </g>
  <circle cx="260" cy="230" r="16" fill="#0b5563"/>
  <circle cx="640" cy="430" r="16" fill="#0b5563"/>
  <circle cx="640" cy="430" r="30" fill="#0b5563" opacity="0.18"/>
  <text x="260" y="192" font-family="-apple-system,PingFang TC,Noto Sans TC,sans-serif" font-size="34" font-weight="700" fill="#0b3a44">用藥期間</text>
  <text x="640" y="500" font-family="-apple-system,PingFang TC,Noto Sans TC,sans-serif" font-size="34" font-weight="700" fill="#b8701c">停藥後？</text>
</svg>
