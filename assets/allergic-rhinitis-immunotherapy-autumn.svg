<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.085"/></feComponentTransfer>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="3" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="21" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wash" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="26" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="7"/>
    </filter>
    <filter id="softwash" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="4" seed="11" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="34" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#f8f0e1"/>

  <g filter="url(#softwash)" opacity="0.38">
    <path d="M880 170 C1150 150 1290 330 1260 540 C1232 740 1030 840 850 800 C676 762 620 580 666 430 C708 292 760 182 880 170 Z" fill="#e6c7b9"/>
  </g>
  <g filter="url(#softwash)" opacity="0.26">
    <path d="M280 240 C440 190 570 280 548 406 C528 522 380 572 272 530 C172 490 150 292 280 240 Z" fill="#a9c2b4"/>
  </g>
  <g filter="url(#softwash)" opacity="0.2">
    <path d="M300 648 C480 604 680 666 658 764 C640 856 440 882 318 846 C212 814 170 684 300 648 Z" fill="#d9bb86"/>
  </g>

  <!-- 臉（側面，面向左） -->
  <g filter="url(#rough)">
    <path d="M900 200
             C 800 204, 744 272, 744 368
             C 744 384, 738 392, 728 400
             C 718 408, 710 420, 702 436
             C 688 468, 668 500, 660 522
             C 652 538, 662 554, 680 554
             C 694 554, 702 562, 706 574
             C 710 584, 702 590, 708 598
             C 718 608, 734 606, 740 616
             C 746 626, 732 634, 738 648
             C 746 664, 770 672, 790 676
             C 836 686, 898 678, 936 650
             C 992 608, 1016 512, 1010 412
             C 1004 286, 976 202, 900 200 Z"
          fill="#f6e2d2" stroke="#6b5444" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- 鼻頭泛紅 -->
  <g filter="url(#wash)" opacity="0.52">
    <path d="M688 488 C 714 498, 718 540, 700 564 C 682 586, 652 580, 650 552 C 648 526, 668 482, 688 488 Z" fill="#cf6f5e"/>
  </g>
  <!-- 鼻樑淡暈 -->
  <g filter="url(#wash)" opacity="0.2">
    <path d="M716 416 C 740 424, 740 468, 720 494 C 702 516, 680 508, 682 484 C 684 458, 700 410, 716 416 Z" fill="#d98a78"/>
  </g>

  <!-- 五官（極簡） -->
  <g filter="url(#rough2)" fill="none" stroke="#6b5444" stroke-linecap="round">
    <path d="M772 358 C 806 336, 852 338, 880 354" stroke-width="9" stroke="#5d4a3c"/>
    <path d="M774 404 C 798 390, 838 390, 856 406" stroke-width="5"/>
    <path d="M778 408 C 800 420, 834 420, 852 410" stroke-width="3.6" opacity="0.7"/>
    <circle cx="812" cy="410" r="7" fill="#5d4a3c" stroke="none"/>
    <path d="M682 558 C 694 552, 706 558, 710 570" stroke-width="4.6"/>
    <path d="M724 626 C 750 616, 778 618, 794 628" stroke-width="5"/>
