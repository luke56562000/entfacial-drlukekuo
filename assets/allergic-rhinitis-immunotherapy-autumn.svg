    </g>
    <g transform="translate(120 620) rotate(32) scale(0.72)">
      <path d="M0 0 C 40 -34, 96 -30, 118 0 C 96 32, 40 36, 0 0 Z" fill="#cf9a5c" opacity="0.6" stroke="#8a5c33" stroke-width="4"/>
      <path d="M0 0 L 118 0" stroke="#8a5c33" stroke-width="3"/>
    </g>
    <g transform="translate(560 650) rotate(-40) scale(0.62)">
