<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf3f5"/><stop offset="1" stop-color="#d3e6ea"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbeadb"/><stop offset="1" stop-color="#f2d2bc"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0b3a44" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1360" cy="170" r="230" fill="#0b5563" opacity="0.06"/>
  <circle cx="200" cy="780" r="170" fill="#0b5563" opacity="0.06"/>
  <g fill="#0b5563" opacity="0.10">
    <circle cx="120" cy="120" r="4"/><circle cx="160" cy="120" r="4"/><circle cx="200" cy="120" r="4"/>
    <circle cx="120" cy="160" r="4"/><circle cx="160" cy="160" r="4"/><circle cx="200" cy="160" r="4"/>
    <circle cx="120" cy="200" r="4"/><circle cx="160" cy="200" r="4"/><circle cx="200" cy="200" r="4"/>
  </g>

  <!-- 孩子側臉（面向左） -->
  <g filter="url(#sh)">
    <rect x="700" y="640" width="200" height="180" rx="40" fill="#f2d2bc"/>
    <path d="M760 150 C 900 150, 1000 250, 1000 400 C 1000 560, 920 680, 800 690 C 690 700, 600 640, 560 560 C 520 480, 490 470, 500 420 C 510 380, 540 380, 545 340 C 560 230, 640 150, 760 150 Z" fill="url(#skin)"/>
    <!-- 頭髮 -->
    <path d="M560 330 C 590 190, 720 130, 800 140 C 920 150, 1000 250, 1000 380 C 960 300, 900 270, 820 280 C 740 290, 660 300, 620 360 C 600 330, 580 320, 560 330 Z" fill="#3b2a24"/>
    <!-- 眼睛、眉毛、嘴 -->
    <path d="M560 400 C 590 385, 620 388, 640 400" fill="none" stroke="#3b2a24" stroke-width="8" stroke-linecap="round"/>
    <circle cx="598" cy="440" r="14" fill="#2b1f1a"/>
    <circle cx="592" cy="434" r="5" fill="#fff"/>
    <path d="M540 560 C 560 590, 600 592, 630 575" fill="none" stroke="#c96f6a" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="640" cy="520" rx="34" ry="18" fill="#f3b8a6" opacity="0.45"/>
  </g>

  <!-- 耳朵 -->
  <g filter="url(#sh)">
    <path d="M905 420 C 960 380, 1010 430, 990 500 C 975 550, 940 570, 915 560 C 895 550, 890 520, 900 500 C 920 480, 935 470, 930 445 C 925 425, 912 425, 905 420 Z" fill="#f2d2bc" stroke="#d9a98f" stroke-width="6"/>
    <path d="M925 455 C 950 445, 965 470, 955 495" fill="none" stroke="#d9a98f" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 耳咽管示意：從耳朵到鼻咽（半透明疊在臉上） -->
  <path d="M912 505 C 860 545, 790 565, 700 570" fill="none" stroke="#0b5563" stroke-width="22" stroke-linecap="round" opacity="0.28"/>
  <path d="M912 505 C 860 545, 790 565, 700 570" fill="none" stroke="#0b5563" stroke-width="10" stroke-linecap="round" stroke-dasharray="4 26"/>
  <g fill="none" stroke="#e0902e" stroke-width="7" stroke-linecap="round"><path d="M760 546 C 766 552, 766 560, 760 566"/><path d="M810 540 C 818 548, 818 558, 810 566"/><path d="M860 528 C 868 536, 868 548, 860 556"/></g>
  <g fill="none" stroke="#e0902e" stroke-width="8" stroke-linecap="round"><path d="M1010 460 C 1030 480, 1030 520, 1010 540"/><path d="M1040 440 C 1070 470, 1070 530, 1040 560"/></g>
  <text x="640" y="615" font-family="-apple-system,PingFang TC,Noto Sans TC,sans-serif" font-size="30" font-weight="700" fill="#0b3a44">耳咽管關不緊</text>

  <!-- 自己的聲音回到耳朵：由嘴出發的聲波，繞回耳朵 -->
  <g fill="none" stroke="#e0902e" stroke-width="10" stroke-linecap="round">
    <path d="M470 560 C 420 560, 390 540, 380 510"/>
    <path d="M440 600 C 380 600, 340 560, 330 510"/>
    <path d="M410 640 C 340 640, 290 580, 280 510"/>
  </g>
  

  <!-- 對話框 -->
  <g filter="url(#sh)">
    <rect x="1080" y="440" width="380" height="150" rx="30" fill="#ffffff"/>
    <path d="M1090 520 L 1040 540 L 1090 560 Z" fill="#ffffff"/>
    <text x="1270" y="505" font-family="-apple-system,PingFang TC,Noto Sans TC,sans-serif" font-size="36" font-weight="700" fill="#0b3a44" text-anchor="middle">聽到自己</text>
    <text x="1270" y="555" font-family="-apple-system,PingFang TC,Noto Sans TC,sans-serif" font-size="36" font-weight="700" fill="#0b3a44" text-anchor="middle">講話的回音？</text>
  </g>
</svg>
