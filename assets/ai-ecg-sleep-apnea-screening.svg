<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.085"/></feComponentTransfer>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="3" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="21" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wash" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="26" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="7"/>
    </filter>
    <filter id="softwash" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="4" seed="11" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="34" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f7efe2"/>

  <g filter="url(#softwash)" opacity="0.28">
    <path d="M60 60 C400 30 580 170 560 370 C540 560 360 660 180 620 C20 584 -40 290 60 60 Z" fill="#8c9fbb"/>
  </g>
  <g filter="url(#softwash)" opacity="0.26">
    <path d="M1130 60 C1430 30 1590 180 1570 380 C1550 570 1370 650 1210 610 C1060 574 1010 280 1130 60 Z" fill="#e2bd7a"/>
  </g>

  <!-- 月與 Zzz -->
  <g filter="url(#rough2)">
    <circle cx="206" cy="166" r="58" fill="#f6edd6" stroke="#6b5444" stroke-width="3.4"/>
    <path d="M232 136 C 262 150, 264 186, 236 202 C 264 206, 284 180, 277 154 C 270 132, 248 126, 232 136 Z" fill="#dfd2b4" opacity="0.75"/>
    <g fill="#e7dcc0"><circle cx="318" cy="120" r="5"/><circle cx="112" cy="250" r="4.4"/><circle cx="346" cy="232" r="4"/></g>
  </g>
  <g filter="url(#rough2)" fill="none" stroke="#7d8ea6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M316 108 L 372 108 L 316 164 L 372 164" stroke-width="7"/>
    <path d="M396 196 L 440 196 L 396 240 L 440 240" stroke-width="5.6" opacity="0.75"/>
    <path d="M460 262 L 494 262 L 460 296 L 494 296" stroke-width="4.4" opacity="0.55"/>
  </g>

  <!-- 日與咖啡 -->
  <g filter="url(#rough2)">
    <circle cx="1392" cy="166" r="56" fill="#f0d49a" stroke="#6b5444" stroke-width="3.4"/>
    <g stroke="#c89a55" stroke-width="5" stroke-linecap="round" opacity="0.85">
      <path d="M1392 78 L 1392 50"/><path d="M1392 282 L 1392 254"/>
      <path d="M1304 166 L 1276 166"/><path d="M1508 166 L 1480 166"/>
      <path d="M1330 104 L 1310 84"/><path d="M1454 228 L 1474 248"/>
      <path d="M1454 104 L 1474 84"/><path d="M1330 228 L 1310 248"/>
    </g>
  </g>
  <g filter="url(#rough)" transform="translate(1210 626)">
    <path d="M0 24 L 196 24 C 200 112, 184 178, 150 202 L 46 202 C 12 178, -4 112, 0 24 Z"
          fill="#efe3d2" stroke="#6b5444" stroke-width="4" stroke-linejoin="round"/>
    <path d="M196 56 C 250 50, 274 78, 268 112 C 262 146, 230 158, 192 150" fill="none" stroke="#6b5444" stroke-width="4.4"/>
    <path d="M8 46 C 70 60, 130 60, 190 46 C 186 62, 182 72, 180 80 C 126 92, 70 92, 16 80 C 12 70, 10 60, 8 46 Z" fill="#8a5a42" opacity="0.85"/>
    <path d="M-20 212 L 216 212 C 220 228, 212 238, 196 238 L 0 238 C -16 238, -24 228, -20 212 Z" fill="#dcc6a8" stroke="#6b5444" stroke-width="4" stroke-linejoin="round"/>
    <g fill="none" stroke="#b79a7c" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <path d="M52 -4 C 36 -28, 60 -46, 44 -72"/>
      <path d="M104 -8 C 88 -34, 112 -52, 96 -80"/>
      <path d="M156 -4 C 140 -28, 164 -46, 148 -72"/>
    </g>
  </g>

  <!-- 心電圖紙帶 -->
  <g filter="url(#rough)">
    <path d="M-20 326 L 1620 326 L 1620 644 L -20 644 Z" fill="#fbf4e6" stroke="#6b5444" stroke-width="3.4"/>
  </g>
  <g stroke="#e3c8b0" stroke-width="1.6" opacity="0.65">
    <path d="M0 366 H1600 M0 406 H1600 M0 446 H1600 M0 486 H1600 M0 526 H1600 M0 566 H1600 M0 606 H1600"/>
    <path d="M40 326 V644 M120 326 V644 M200 326 V644 M280 326 V644 M360 326 V644 M440 326 V644 M520 326 V644 M600 326 V644 M680 326 V644 M760 326 V644 M840 326 V644 M920 326 V644 M1000 326 V644 M1080 326 V644 M1160 326 V644 M1240 326 V644 M1320 326 V644 M1400 326 V644 M1480 326 V644 M1560 326 V644"/>
  </g>

  <!-- 波形：左段 → 心形 → 右段 -->
  <g filter="url(#rough2)" fill="none" stroke="#c2574a" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -30 470 l 40 0 q 16 -18 32 0 l 16 0 l 9 24 l 12 -96 l 12 96 l 13 -24 l 18 0 q 26 -28 52 0 l 30 0 M 220 470 l 40 0 q 16 -18 32 0 l 16 0 l 9 24 l 12 -96 l 12 96 l 13 -24 l 18 0 q 26 -28 52 0 l 30 0"/>
    <path d="M660 470 L 690 470"/>
    <path d="M690 470
             C 690 424, 716 402, 748 402
             C 774 402, 792 418, 800 438
             C 808 418, 826 402, 852 402
             C 884 402, 910 424, 910 470
             C 910 512, 858 556, 800 596
             C 742 556, 690 512, 690 470 Z"/>
    <path d="M910 470 L 940 470"/>
    <path d="M 930 470 l 40 0 q 16 -18 32 0 l 16 0 l 9 24 l 12 -96 l 12 96 l 13 -24 l 18 0 q 26 -28 52 0 l 30 0 M 1180 470 l 40 0 q 16 -18 32 0 l 16 0 l 9 24 l 12 -96 l 12 96 l 13 -24 l 18 0 q 26 -28 52 0 l 30 0 M 1430 470 l 40 0 q 16 -18 32 0 l 16 0 l 9 24 l 12 -96 l 12 96 l 13 -24 l 18 0 q 26 -28 52 0 l 30 0"/>
  </g>

  <!-- AI 節點分析 -->
  <g filter="url(#rough2)" opacity="0.95">
    <g stroke="#5f8f9c" stroke-width="3" opacity="0.7" fill="none">
      <path d="M560 250 L 672 300 M672 300 L 800 352 M800 352 L 940 300 M940 300 L 1052 248"/>
      <path d="M672 300 L 940 300 M560 250 L 800 352 M800 352 L 1052 248"/>
      <path d="M800 352 L 800 402"/>
    </g>
    <g fill="#f7efe2" stroke="#5f8f9c" stroke-width="4">
      <circle cx="560" cy="250" r="12"/><circle cx="672" cy="300" r="10"/>
      <circle cx="800" cy="352" r="13"/><circle cx="940" cy="300" r="10"/><circle cx="1052" cy="248" r="12"/>
    </g>
  </g>

  <!-- AI 標記的異常區段 -->
  <g filter="url(#rough2)">
    <rect x="360" y="368" width="236" height="216" rx="20" fill="none" stroke="#5f8f9c" stroke-width="5" stroke-dasharray="18 14"/>
  </g>

  <rect width="1600" height="900" filter="url(#paper)"/>
</svg>
